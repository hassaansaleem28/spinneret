<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    Spinneret mark, tuned for a browser tab rather than the page.

    The in-app version carries eight fine threads and two concentric rings, which
    turn to mush at 16px. This keeps the same idea (radials leaving a hub) but at
    weights that survive the downscale, and sits on a dark plate so it holds its
    shape against both a light and a dark tab strip.
  -->
  <rect width="32" height="32" rx="7" fill="#06070A"/>
  <g stroke="#F0B429" stroke-width="2.6" stroke-linecap="round">
    <line x1="16" y1="16" x2="16" y2="4.5"/>
    <line x1="16" y1="16" x2="24.1" y2="7.9"/>
    <line x1="16" y1="16" x2="27.5" y2="16"/>
    <line x1="16" y1="16" x2="24.1" y2="24.1"/>
    <line x1="16" y1="16" x2="16" y2="27.5"/>
    <line x1="16" y1="16" x2="7.9" y2="24.1"/>
    <line x1="16" y1="16" x2="4.5" y2="16"/>
    <line x1="16" y1="16" x2="7.9" y2="7.9"/>
  </g>
  <circle cx="16" cy="16" r="4.6" fill="#06070A"/>
  <circle cx="16" cy="16" r="3.2" fill="#F0B429"/>
</svg>
